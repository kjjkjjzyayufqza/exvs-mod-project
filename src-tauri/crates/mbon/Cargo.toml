[package]
name = "exvs_mbon"
version = "0.1.0"
description = "Isolated MBON (PS4 Maxi Boost ON) workspace for EXVS Mod Project by kjjkjjzyayufqza. MBON format research: descatal / BoostStudio."
authors = ["kjjkjjzyayufqza"]
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/kjjkjjzyayufqza/exvs-mod-project"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
doctest = false

[[bin]]
name = "mbon_tool"
path = "src/bin/mbon_tool.rs"
test = false

[dependencies]
exvs_ps4_common = { path = "../ps4_common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
