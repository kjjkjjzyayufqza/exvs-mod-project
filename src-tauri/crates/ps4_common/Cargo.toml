[package]
name = "exvs_ps4_common"
version = "0.1.0"
description = "Shared PS4 archive layer for the isolated MBON and GVS workspaces of EXVS Mod Project (by kjjkjjzyayufqza)."
authors = ["kjjkjjzyayufqza"]
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/kjjkjjzyayufqza/exvs-mod-project"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rayon = "1.10"
image = { version = "0.25.9", default-features = false, features = ["png"] }
image_dds = { version = "0.7.2", features = ["ddsfile", "image"] }

[dev-dependencies]
tempfile = "3"
