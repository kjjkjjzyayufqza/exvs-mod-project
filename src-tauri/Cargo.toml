[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-persisted-scope = "2.3.4"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
notify = "8.2.0"
tauri-plugin-opener = "2"
# 0.12+ supports base_port; default 9223 falls inside Windows Hyper-V excluded ranges on many machines (error 10013).
tauri-plugin-mcp-bridge = "0.12"

nutexb = { git = "https://github.com/kjjkjjzyayufqza/nutexb", features = ["ddsfile"] }
ssbh_data = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2-merge", package = "ssbh_data", features = ["serde"] }
ssbh_lib = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2-merge", package = "ssbh_lib" }
base64 = "0.22"
crc32fast = "1.4"
image = "0.25.9"
image_dds = { version = "0.7.2", features = ["ddsfile", "image"] }
encoding_rs = "0.8"
anyhow = "1.0"
binrw = "0.15"
xmltree = "0.10.3"
glam = { version = "0.30", features = ["mint"] }
topological-sort = "0.2.2"
indexmap = "2.2.5"
ufbx = "0.10"
fbxcel = { version = "0.9.0", features = ["writer"] }
flate2 = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rayon = "1.10"
chull = "0.2.4"
sha1 = "0.10"
sha2 = "0.10"

# --- Build profiles -------------------------------------------------------

# Dev memory profile: line-tables-only keeps breakpoints usable while
# shrinking libapp_lib rlib size (full debuginfo was ~800MB per hash).
# Parallel rustc is capped in .cargo/config.toml (jobs = 3) for peak RAM.
# App code stays opt-level 0 (default); dependencies use opt-level 1 so
# decode/mesh crates (image_dds, ufbx, glam, rayon) stay usable at runtime.
#
# Examples: cargo run --example <name> --features nuanmb-examples
# Motion tests: cargo test --features motion-tests --test <name>
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

# Release: smaller, faster production binary. `panic` is intentionally left as
# the default "unwind" — the format parsers (binrw / image / ufbx) can panic on
# malformed input and must not abort the whole process. ThinLTO keeps build
# time reasonable while still optimizing across crate boundaries; `strip`
# removes debug symbols to shrink the shipped binary.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true


