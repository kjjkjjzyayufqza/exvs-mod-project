[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"
default-run = "app"
autobins = false
autoexamples = false
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
legacy-cli-tools = []
# Heavy SSBH motion integration harnesses (FBX import/export/interchange).
# Default `cargo test` only builds agent CLI suites. Opt in with:
#   cargo test --features motion-tests
#   cargo test --features motion-tests --test ssbh_motion_interchange_test
motion-tests = []
# Offline nuanmb research examples (22 targets). Keep off default cargo/RA
# check paths so flycheck does not expand the analysis/build surface.
nuanmb-examples = []

[lib]
name = "app_lib"
# Desktop-only build: the `app` binary links `app_lib` as an rlib. The
# `staticlib`/`cdylib` crate types are only required for mobile (iOS/Android)
# FFI — re-add them if a mobile target is introduced. Dropping them avoids
# building/linking two unused artifacts on every build.
#
# `test = false` keeps the ~460 inline `#[cfg(test)]` unit tests out of
# default `cargo test` (they still exist for targeted lib testing if re-enabled).
crate-type = ["lib"]
test = false
doctest = false

# Keep historical utility binaries available for cargo run/build, but do not
# build their test harnesses during cargo test. Several legacy targets are heavy
# enough to exhaust memory when Cargo auto-discovers every test target.
[[bin]]
name = "app"
path = "src/main.rs"
test = false

[[bin]]
name = "crc32_brute_seed"
path = "src/bin/crc32_brute_seed.rs"
test = false
required-features = ["legacy-cli-tools"]

[[bin]]
name = "debug_hkt_to_obj"
path = "src/bin/debug_hkt_to_obj.rs"
test = false
required-features = ["legacy-cli-tools"]

[[bin]]
