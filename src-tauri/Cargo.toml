[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-persisted-scope = "2.3.4"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
notify = "8.2.0"
tauri-plugin-opener = "2"
tauri-plugin-mcp-bridge = "0.2"

nutexb = { git = "https://github.com/kjjkjjzyayufqza/nutexb", features = ["ddsfile"] }
ssbh_data = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2", package = "ssbh_data", features = ["serde"] }
ssbh_lib = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2", package = "ssbh_lib" }
base64 = "0.22"
crc32fast = "1.4"
image = "0.25.9"
image_dds = { version = "0.7.2", features = ["ddsfile", "image"] }
encoding_rs = "0.8"
anyhow = "1.0"
binrw = "0.15"
xmltree = "0.10.3"
glam = { version = "0.30", features = ["mint"] }
topological-sort = "0.2.2"
indexmap = "2.2.5"
ufbx = "0.10"
flate2 = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rayon = "1.10"
