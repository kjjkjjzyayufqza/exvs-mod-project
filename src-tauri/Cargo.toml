[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# Desktop-only build: the `app` binary links `app_lib` as an rlib. The
# `staticlib`/`cdylib` crate types are only required for mobile (iOS/Android)
# FFI — re-add them if a mobile target is introduced. Dropping them avoids
# building/linking two unused artifacts on every build.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-persisted-scope = "2.3.4"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
notify = "8.2.0"
tauri-plugin-opener = "2"
tauri-plugin-mcp-bridge = "0.2"

nutexb = { git = "https://github.com/kjjkjjzyayufqza/nutexb", features = ["ddsfile"] }
ssbh_data = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2", package = "ssbh_data", features = ["serde"] }
ssbh_lib = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2", package = "ssbh_lib" }
base64 = "0.22"
crc32fast = "1.4"
image = "0.25.9"
image_dds = { version = "0.7.2", features = ["ddsfile", "image"] }
encoding_rs = "0.8"
anyhow = "1.0"
binrw = "0.15"
xmltree = "0.10.3"
glam = { version = "0.30", features = ["mint"] }
topological-sort = "0.2.2"
indexmap = "2.2.5"
ufbx = "0.10"
flate2 = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rayon = "1.10"

# --- Build profiles -------------------------------------------------------

# Dev: keep app code unoptimized (default opt-level 0) for fast incremental
# rebuilds, but optimize dependencies once (they rarely change) so heavy
# decode/mesh crates such as image_dds, ufbx, glam and rayon are not crippling
# at runtime during dev.
[profile.dev.package."*"]
opt-level = 1

# Release: smaller, faster production binary. `panic` is intentionally left as
# the default "unwind" — the format parsers (binrw / image / ufbx) can panic on
# malformed input and must not abort the whole process. ThinLTO keeps build
# time reasonable while still optimizing across crate boundaries; `strip`
# removes debug symbols to shrink the shipped binary.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
