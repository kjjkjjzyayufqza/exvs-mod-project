[package]
name = "efxbn-preview-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
app_lib = { package = "app", path = "../../../src-tauri" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
ssbh_data = { git = "https://github.com/kjjkjjzyayufqza/ssbh_lib", branch = "wmmt2-merge", package = "ssbh_data", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 1
