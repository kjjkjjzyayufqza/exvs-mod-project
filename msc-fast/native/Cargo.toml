[package]
name = "msc_fast"
version = "0.1.0"
edition = "2021"
description = "Isolated native MSC decompile/compile. Does not replace tools/."

[lib]
name = "msc_fast"

[[bin]]
name = "msc_fast_msclang"
path = "src/bin/msclang.rs"

[[bin]]
name = "msc_fast_bench"
path = "src/bin/bench.rs"

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
