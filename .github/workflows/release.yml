name: release

# Windows x64 zip publishing is local: pnpm release:windows
# (see .github/scripts/publish-windows-release.ps1). This workflow is an
# optional fallback and does not run on push.
on:
  workflow_dispatch:

concurrency:
  group: release-windows
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      # Honor src-tauri/Cargo.toml [profile.release] (thin LTO, codegen-units=1).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release secrets
        env:
          CARGO_GIT_TOKEN: ${{ secrets.CARGO_GIT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          EXVS_UPDATER_GITHUB_TOKEN: ${{ secrets.EXVS_UPDATER_GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:CARGO_GIT_TOKEN) {
            throw "Missing CARGO_GIT_TOKEN. Create a PAT with Contents: Read on kjjkjjzyayufqza/ssbh_lib and set it as the CARGO_GIT_TOKEN repository secret."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY. The Windows x64 zip cannot be signed without it."
          }
          if (-not $env:EXVS_UPDATER_GITHUB_TOKEN) {
            Write-Host "EXVS_UPDATER_GITHUB_TOKEN is unset; the app will bake CARGO_GIT_TOKEN so private GitHub Releases stay readable."
          }

      - name: Prove updater token can read this repository
        env:
          GH_TOKEN: ${{ secrets.EXVS_UPDATER_GITHUB_TOKEN || secrets.CARGO_GIT_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) {
            throw "No token available to bake into the updater. Set EXVS_UPDATER_GITHUB_TOKEN (Contents: Read on this repo) or a CARGO_GIT_TOKEN that can read this private repository."
          }
          $name = gh api repos/kjjkjjzyayufqza/exvs-mod-project --jq ".full_name"
          if ($name -ne "kjjkjjzyayufqza/exvs-mod-project") {
            throw "Updater token cannot read kjjkjjzyayufqza/exvs-mod-project"
          }
          Write-Host "Updater token can read $name"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate private Cargo git deps
        env:
          CARGO_GIT_TOKEN: ${{ secrets.CARGO_GIT_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:CARGO_GIT_TOKEN) {
            throw "Missing CARGO_GIT_TOKEN. Create a PAT with Contents: Read on kjjkjjzyayufqza/ssbh_lib and set it as the CARGO_GIT_TOKEN repository secret."
          }
          git config --global url."https://x-access-token:$($env:CARGO_GIT_TOKEN)@github.com/".insteadOf "https://github.com/"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: release-windows
          cache-on-failure: true
          env-vars: EXVS_UPDATER_GITHUB_TOKEN
        env:
          EXVS_UPDATER_GITHUB_TOKEN: ${{ secrets.EXVS_UPDATER_GITHUB_TOKEN || secrets.CARGO_GIT_TOKEN }}

      - name: Stamp release version
        run: node .github/scripts/stamp-release-version.mjs "0.1.${{ github.run_number }}"

      - name: Guard Tauri extra bins
        run: python .github/scripts/check_tauri_bundle_bins.py --self-check

      - name: Collect changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $previous = ""
          try {
            $previous = gh release list --limit 1 --json tagName --jq ".[0].tagName"
          } catch {
            $previous = ""
          }
          if ($previous) {
            git fetch --tags --force 2>$null | Out-Null
            $log = git log "$previous..HEAD" --pretty=format:"- %s" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $log) {
              $log = git log -20 --pretty=format:"- %s"
            }
          } else {
            $log = git log -20 --pretty=format:"- %s"
          }
          if ($log -is [array]) {
            $log = $log -join "`n"
          }
          if (-not $log) {
            $log = "- Windows release of EXVS Mod Project."
          }
          $body = @(
            "Windows x64 release of EXVS Mod Project.",
            "",
            $log,
            "",
            "- EXVS-Mod-Project-<version>-windows-x64.zip is the Windows x64 build.",
            "- Installed copies check this GitHub Release on every launch."
          ) -join "`n"
          $eof = "RELNOTES_EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$eof"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $eof

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EXVS_UPDATER_GITHUB_TOKEN: ${{ secrets.EXVS_UPDATER_GITHUB_TOKEN || secrets.CARGO_GIT_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: EXVS Mod Project v__VERSION__
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          updaterJsonPreferNsis: false
          args: --no-bundle

      - name: Resolve published version
        id: published
        shell: pwsh
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}".Trim()
          if (-not $version) {
            $version = "0.1.${{ github.run_number }}"
          }
          $tag = if ($version.StartsWith("v")) { $version } else { "v$version" }
          "version=$version" | Add-Content $env:GITHUB_OUTPUT
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "published version $version tag $tag"

      - name: Verify Windows x64 exe
        shell: pwsh
        run: |
          $releaseDir = "src-tauri\target\release"
          $exe = @(
            (Join-Path $releaseDir "EXVS Mod Project.exe"),
            (Join-Path $releaseDir "app.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "Release executable was not found in $releaseDir"
          }
          Write-Host "Windows x64 exe: $exe ($((Get-Item -LiteralPath $exe).Length) bytes)"

      - name: Pack portable zip
        shell: pwsh
        run: |
          .\.github\scripts\pack-portable-zip.ps1 `
            -Version "${{ steps.published.outputs.version }}" `
            -OutputZip "EXVS-Mod-Project-${{ steps.published.outputs.version }}-windows-x64.zip"

      - name: Sign zip
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = "${{ steps.published.outputs.version }}"
          $zipName = "EXVS-Mod-Project-$version-windows-x64.zip"
          pnpm tauri signer sign $zipName
          $sigPath = "$zipName.sig"
          if (-not (Test-Path -LiteralPath $sigPath)) {
            throw "Windows x64 zip signature was not produced at $sigPath"
          }

      - name: Upload portable zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.published.outputs.tag }}" `
            "EXVS-Mod-Project-${{ steps.published.outputs.version }}-windows-x64.zip" `
            --clobber

      - name: Verify GitHub Release zip asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.published.outputs.tag }}"
          $assets = gh release view $tag --json assets --jq ".assets[].name"
          Write-Host $assets
          if ($assets -notmatch "windows-x64.zip") {
            throw "GitHub Release $tag is missing the windows-x64 zip"
          }
